[package]
name = "ai-translator"
version = "0.5.0"
description = "Lightweight Windows AI translator"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
thiserror = "2"
log = "0.4"
arboard = "3"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25", default-features = false, features = ["pattern", "input"] }
windows-registry = "0.6"
# uiautomation 0.25 references this API from its input module but does not forward the feature.
windows-uia-compat = { package = "windows", version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
