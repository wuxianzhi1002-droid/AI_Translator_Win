<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 翻译工具</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="translator">
    <section class="pane source-pane">
      <header><strong>源语言：自动检测</strong><span class="spacer"></span><button id="settings" class="icon" title="设置">⚙</button></header>
      <div class="editor-wrap"><textarea id="source" placeholder="输入文本…"></textarea><button id="clipboard-card" hidden><strong>剪贴板内容：</strong><span></span></button></div>
      <footer><button id="clear">清空</button><label><input id="auto-submit" type="checkbox"> 自动提交</label><span class="spacer"></span><label>附加要求： <select id="addition"></select></label></footer>
    </section>
    <button id="translate" class="translate" title="翻译（Ctrl+Enter）"><span>▶</span></button>
    <section class="pane target-pane">
      <header><strong>目标语言：</strong><select id="language"></select><span class="spacer"></span><span id="stale" hidden>◷ 结果已过期</span><button id="pin" class="icon" title="窗口置顶">📌</button></header>
      <article id="result" data-placeholder="翻译结果…"></article><div id="status"></div>
      <footer><span class="muted">模型：</span><button id="model-picker" class="picker-button"><span>请选择模型</span><b>⌄</b></button><span class="spacer"></span><button id="copy">▣ 复制</button></footer>
    </section>
  </main>
  <section id="setup-overlay" hidden><div class="setup-card"><div class="setup-icon">⚙</div><h2>需要完成模型设置</h2><p id="setup-message">尚未添加可用的服务商和模型。</p><button id="open-settings" class="primary">⚙ 打开设置</button></div></section>
  <dialog id="model-dialog" class="picker-dialog"><header><h3>选择模型</h3><button class="dialog-close" aria-label="关闭">×</button></header><div id="model-options" class="model-options"></div><footer><button id="manage-models">管理服务与模型…</button><button class="dialog-close">取消</button></footer></dialog>
  <script type="module" src="app.js"></script>
</body></html>
