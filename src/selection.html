<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>划词翻译</title>
  <link rel="stylesheet" href="selection.css">
  <link rel="stylesheet" href="formula.css">
  <link rel="stylesheet" href="editable-source.css">
</head>
<body class="dot-mode">
  <button id="selection-dot" aria-label="翻译选中文字" title="悬停翻译"></button>

  <main id="card">
    <div class="preferences">
      <label><span id="output-label">目标语言</span><select id="language"></select></label>
      <label>附加要求<select id="addition"></select></label>
      <button id="pin" title="置顶">◇</button>
    </div>

    <textarea id="source" aria-label="可编辑原文" placeholder="请输入需要翻译的原文"></textarea>
    <article id="result"><span class="placeholder">正在翻译…</span></article>

    <footer>
      <span id="status"></span>
      <button id="copy">复制译文</button>
    </footer>
  </main>
  <script type="module" src="selection.js"></script>
</body>
</html>
